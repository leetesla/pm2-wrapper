name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: sh -n scripts/install.sh
      - run: make -n nvmrc
      - run: make -n preview NODE_VERSION=22.21.1
      - run: make -n install NODE_VERSION=22.21.1
      - run: ./scripts/install.sh --help
